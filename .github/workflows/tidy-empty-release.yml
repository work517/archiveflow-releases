name: Tidy an empty release

# One-off maintenance. On 2026-09-28 two releases were created by accident for the tags
# v0.2.1 and v0.3.0 with no assets attached, and one of them became the repository's
# "Latest" — so anyone landing on the releases page saw a version with nothing to download.
#
# The guard below is the point of this file: it refuses any release that carries even one
# asset. The real releases (three files each) and the two drafts (one file each) cannot be
# removed by it, whatever tag is typed in. The git tag is never touched; only the release
# entry that points at it.
#
# Delete this workflow once the cleanup is done.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag whose release to remove — refused unless it has zero assets'
        required: true
        type: string

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - name: Remove the release, but only when it carries no files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Reachable by tag means published: drafts are not addressable this way, so this
          # can only ever resolve to the accidental entry.
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          id=$(jq -r '.id' <<<"$release")
          assets=$(jq -r '.assets | length' <<<"$release")
          name=$(jq -r '.name // .tag_name' <<<"$release")
          echo "tag=$TAG id=$id name=$name assets=$assets"

          if [ "$assets" != "0" ]; then
            echo "::error::$TAG has $assets file(s) attached. Refusing — this workflow only removes empty releases."
            exit 1
          fi

          gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          echo "::notice::Removed the empty release for $TAG. The tag itself is untouched."
